name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "LearnHub.sln"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "LearnHub.sln"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore LearnHub.sln

      - name: Build
        run: dotnet build LearnHub.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test LearnHub.sln --no-build --configuration Release --verbosity normal
